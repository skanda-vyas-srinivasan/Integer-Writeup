<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760" role="img" aria-labelledby="title desc">
  <title id="title">Simple integer program and its bipartite graph</title>
  <desc id="desc">A small integer program with two variables and two constraints, shown next to its variable-constraint bipartite graph.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #111827; }
      .heading { font: 700 28px Arial, Helvetica, sans-serif; fill: #111827; }
      .math { font: 30px Georgia, 'Times New Roman', serif; fill: #111827; }
      .small { font: 21px Arial, Helvetica, sans-serif; fill: #374151; }
      .tiny { font: 18px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .nodeText { font: 700 25px Arial, Helvetica, sans-serif; fill: #111827; }
      .edge { stroke: #64748b; stroke-width: 4; }
      .coef { font: 20px Georgia, 'Times New Roman', serif; fill: #334155; }
    </style>
  </defs>

  <text x="700" y="55" text-anchor="middle" class="title">A Tiny Integer Program as a Bipartite Graph</text>

  <text x="95" y="130" class="heading">Integer program</text>
  <text x="95" y="185" class="math">minimize</text>
  <text x="300" y="185" class="math">x₁ + x₂ + x₃</text>

  <text x="95" y="250" class="math">subject to</text>
  <text x="300" y="250" class="math">x₁ + 2x₂ ≥ 3</text>
  <text x="300" y="305" class="math">2x₁ + x₃ ≥ 3</text>
  <text x="300" y="360" class="math">x₁, x₂, x₃ ∈ ℤ₊</text>

  <text x="95" y="455" class="small">Constraints become constraint nodes.</text>
  <text x="95" y="490" class="small">Variables become variable nodes.</text>
  <text x="95" y="525" class="small">An edge appears when a variable has a nonzero coefficient in a constraint.</text>

  <line x1="665" y1="105" x2="665" y2="680" stroke="#e5e7eb" stroke-width="3"/>

  <text x="875" y="130" text-anchor="middle" class="heading">Bipartite graph</text>
  <text x="780" y="190" text-anchor="middle" class="small">Constraint nodes</text>
  <text x="1160" y="170" text-anchor="middle" class="small">Variable nodes</text>

  <line x1="840" y1="285" x2="1100" y2="235" class="edge"/>
  <line x1="840" y1="285" x2="1100" y2="365" class="edge"/>
  <line x1="840" y1="450" x2="1100" y2="235" class="edge"/>
  <line x1="840" y1="450" x2="1100" y2="495" class="edge"/>

  <text x="966" y="245" class="coef">1</text>
  <text x="952" y="338" class="coef">2</text>
  <text x="945" y="340" class="coef">2</text>
  <text x="966" y="485" class="coef">1</text>

  <circle cx="780" cy="285" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <circle cx="780" cy="450" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="780" y="294" text-anchor="middle" class="nodeText">c1</text>
  <text x="780" y="459" text-anchor="middle" class="nodeText">c2</text>

  <circle cx="1160" cy="235" r="52" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <circle cx="1160" cy="365" r="52" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <circle cx="1160" cy="495" r="52" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="1160" y="244" text-anchor="middle" class="nodeText">x1</text>
  <text x="1160" y="374" text-anchor="middle" class="nodeText">x2</text>
  <text x="1160" y="504" text-anchor="middle" class="nodeText">x3</text>

  <text x="970" y="570" text-anchor="middle" class="small">The edge labels are the corresponding constraint coefficients.</text>
  <text x="970" y="604" text-anchor="middle" class="tiny">For larger MILPs, this same graph representation scales to many variables and constraints.</text>
</svg>
