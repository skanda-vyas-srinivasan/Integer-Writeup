<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Simple integer program and bipartite graph</title>
  <desc id="desc">A small integer program shown above its variable-constraint bipartite graph.</desc>
  <defs>
    <style>
      .title { font: 700 34px Arial, Helvetica, sans-serif; fill: #111827; }
      .heading { font: 700 26px Arial, Helvetica, sans-serif; fill: #111827; }
      .math { font: 31px Georgia, 'Times New Roman', serif; fill: #111827; }
      .small { font: 21px Arial, Helvetica, sans-serif; fill: #374151; }
      .tiny { font: 18px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .nodeText { font: 700 25px Arial, Helvetica, sans-serif; fill: #111827; }
      .edge { stroke: #64748b; stroke-width: 4; }
      .coef { font: 20px Georgia, 'Times New Roman', serif; fill: #334155; }
    </style>
  </defs>

  <text x="600" y="58" text-anchor="middle" class="title">A Tiny Integer Program as a Bipartite Graph</text>

  <text x="210" y="128" class="heading">Integer program</text>
  <text x="210" y="180" class="math">minimize</text>
  <text x="425" y="180" class="math">x₁ + x₂ + x₃</text>

  <text x="210" y="235" class="math">subject to</text>
  <text x="425" y="235" class="math">x₁ + 2x₂ ≥ 3</text>
  <text x="425" y="285" class="math">2x₁ + x₃ ≥ 3</text>
  <text x="425" y="335" class="math">x₁, x₂, x₃ ∈ ℤ₊</text>

  <line x1="140" y1="385" x2="1060" y2="385" stroke="#e5e7eb" stroke-width="3"/>

  <text x="600" y="445" text-anchor="middle" class="heading">Bipartite representation</text>
  <text x="315" y="500" text-anchor="middle" class="small">Constraint nodes</text>
  <text x="885" y="500" text-anchor="middle" class="small">Variable nodes</text>

  <line x1="375" y1="580" x2="825" y2="545" class="edge"/>
  <line x1="375" y1="580" x2="825" y2="635" class="edge"/>
  <line x1="375" y1="695" x2="825" y2="545" class="edge"/>
  <line x1="375" y1="695" x2="825" y2="725" class="edge"/>

  <text x="595" y="548" class="coef">1</text>
  <text x="595" y="620" class="coef">2</text>
  <text x="585" y="610" class="coef">2</text>
  <text x="598" y="720" class="coef">1</text>

  <circle cx="315" cy="580" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <circle cx="315" cy="695" r="58" fill="#dbeafe" stroke="#2563eb" stroke-width="4"/>
  <text x="315" y="589" text-anchor="middle" class="nodeText">c1</text>
  <text x="315" y="704" text-anchor="middle" class="nodeText">c2</text>

  <circle cx="885" cy="545" r="52" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <circle cx="885" cy="635" r="52" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <circle cx="885" cy="725" r="52" fill="#dcfce7" stroke="#16a34a" stroke-width="4"/>
  <text x="885" y="554" text-anchor="middle" class="nodeText">x1</text>
  <text x="885" y="644" text-anchor="middle" class="nodeText">x2</text>
  <text x="885" y="734" text-anchor="middle" class="nodeText">x3</text>

  <text x="600" y="795" text-anchor="middle" class="tiny">Edges correspond to nonzero coefficients in the constraints.</text>
</svg>
